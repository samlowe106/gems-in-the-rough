name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded in-progress runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      # runs every hook in .pre-commit-config.yaml (ruff, black, mypy, ...)
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs uv, provisions Python from .python-version, and caches ~/.cache/uv.
      # setup-uv no longer publishes a moving major tag, so pin a full version.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      # PySide6 links against these at import time; the runner image lacks them.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Sync environment
        run: uv sync --frozen

      # Options (verbose, coverage) come from [tool.pytest.ini_options] in
      # pyproject.toml, so this matches a local `uv run pytest` exactly.
      # QT_QPA_PLATFORM=offscreen lets Qt widgets run without a display server;
      # `-m "not model"` skips the tests that would download Gemma weights.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -m "not model"
